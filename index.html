  ['Woah (feat. Ssj Indigo & TR1PP!!)','Project',1850227465,'2025-10-28T07:00:00Z','https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/e7/de/a6/e7dea667-4944-f8de-c749-3a7956519102/artwork.jpg/600x600bb.jpg','https://music.apple.com/us/album/woah-feat-ssj-indigo-tr1pp/1850227317?i=1850227465'],
  ['2am Inna Raq (Bussin) (feat. TR1PP!!)','Project',1796683307,'2025-02-12T08:00:00Z','https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/ce/df/1f/cedf1fbb-9da1-86ed-fea6-aa08beb3b1fc/artwork.jpg/600x600bb.jpg','https://music.apple.com/us/album/2am-inna-raq-bussin-feat-tr1pp/1796683282?i=1796683307'],
  ['Push2Start (feat. TR1PP!!)','Project',1886428376],
  ['Not Ready For Love (feat. TR1PP!!)','Project',1882603293],
  ['Rich Junkie (feat. TR1PP!!)','Project',1865156614],
  ['We Gon Be Alright (feat. TR1PP!!)','Project',1826951755],
  ['sad songs. (feat. TR1PP!!)','Project',1823539097],
  ['From The Start (feat. TR1PP!!)','Project',1805682166],
  ['CHEESE (feat. TR1PP!!)','TR2PP!!',1785555282]
].map(([t,by,id,d,art,url])=>({t,by,d:d||'',art:art||'',url:url||(AB+id)}));

let F='',view=[],songs=[],cur=null,mv=[];
// Singles by other artists featuring TR1PP (Apple collection IDs): kept out of the albums/singles lists, shown under Featuring.
// Collection IDs that are features (not TR1PP's own albums) — kept out of Albums/Singles
const FX=[1886428376,1882603293,1865156614,1826951755,1823539097,1805682166,1785555282,1796683282,1850227317];
const BLOCK_ALBUMS=new Set([1796683282,1850227317]); // Where Did It Go Wrong?, Drug Musik
const fixName=s=>String(s||'').replace(/\bproject\b/gi,'Project').replace(/^Lost Files$/,'Lost Files (feat. Project)');

const $=s=>document.querySelector(s),D=$('#dlg');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const img=u=>u?`<img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:'';
const fmt=d=>d?new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'}):'';
const rowH=(x,a)=>`<button class="row" ${a}><span class="cv">${img(x.art)}</span><span><span class="t">${esc(x.t)}</span><span class="m">${esc(x.m)}</span></span></button>`;
const nk=s=>String(s||'').toLowerCase().replace(/\s*\((feat|ft)\b[^)]*\)/,'').replace(/[^a-z0-9]/g,'');
const spot=(p,t)=>{const a=SPA[nk(p.name)];return a&&a[t.n-1]?SP+'track/'+a[t.n-1]:''};
const own=(t,art,apple,sp)=>({t,art,apple,sp,q:'TR1PP '+t,own:1});
const one=p=>{const t=p.tracks[0];return own(t?t.t:p.name,p.art,t?t.url:p.url);};

function link(it,k){
 const o=(LINKS[nk(it.t)]||{})[k];if(o)return o;
 if(k==='spotify'&&it.sp)return it.sp;
 const q=encodeURIComponent(it.q);
 if(k==='apple')return it.apple;
 if(k==='spotify')return 'https://open.spotify.com/search/'+q;
 if(k==='soundcloud')return 'https://soundcloud.com/search/sounds?q='+q;
 return it.own?YT+'/search?query='+encodeURIComponent(it.t):'https://www.youtube.com/results?search_query='+q;
}
const sheet=h=>{D.innerHTML='<div class="dp">'+h+'</div>';if(!D.open)D.showModal();};
const bar=b=>`<div class="bar">${b?'<button class="ib" data-b aria-label="Back">&lsaquo;</button>':'<span></span>'}<button class="ib" data-x aria-label="Close">&times;</button></div>`;
const head=(t,art,m)=>`<div class="ph"><span class="cv">${img(art)}</span><span><span class="t">${esc(t)}</span><span class="m">${esc(m)}</span></span></div>`;
function svc(it,back){
 sheet(bar(back)+head(it.t,it.art,'Listen on')+Object.keys(P).map(k=>`<a class="row" href="${esc(link(it,k))}" target="_blank" rel="noopener">${IC[k]}<span class="t">${P[k][0]}</span></a>`).join(''));
}
function proj(p){
 cur=p;
 sheet(bar(0)+head(p.name,p.art,[p.type,p.d.slice(0,4)].filter(Boolean).join(' \u2022 '))+p.tracks.map((t,i)=>`<button class="tr" data-t="${i}"><span class="n">${i+1}</span><span class="t">${esc(t.t)}</span></button>`).join(''));
}

const BY={notreadyforlove:'Project'}; // Featuring: artist shown under a song, by title (letters/numbers only)
function cat(){
 const yr=d=>d.slice(0,4);
 let L=[...rel.map(p=>({k:'p',p,t:fixName(p.name),art:p.art,d:p.d,m:[yr(p.d),p.type].filter(Boolean).join(' \u2022 ')})),
  ...[...feat.filter(g=>!mv.some(f=>nk(f.t)===nk(g.t))),...mv].map(f=>{
   const key=nk(f.t);
   let artist=BY[key]||(key.includes('notreadyforlove')?'Project':f.by)||'';
   artist=fixName(artist);
   return {k:'f',f:{...f,by:artist},t:f.t,art:f.art,d:f.d,m:[yr(f.d),artist].filter(Boolean).join(' \u2022 ')};
  })]
  .sort((a,b)=>b.d.localeCompare(a.d));
 if(F==='s')L=L.filter(x=>x.k==='p'&&x.p.type!=='Album');
 if(F==='a')L=L.filter(x=>x.k==='p'&&x.p.type==='Album');
 if(F==='f')L=L.filter(x=>x.k==='f');
 // Always show Albums section above Singles & EPs (newest→oldest within each), then Featuring — like Spotify
 const G=F?[['',L]]:[['Albums',L.filter(x=>x.k==='p'&&x.p.type==='Album')],['Singles &amp; EPs',L.filter(x=>x.k==='p'&&x.p.type!=='Album')],['Featuring',L.filter(x=>x.k==='f')]].filter(g=>g[1].length);
 view=G.flatMap(g=>g[1]);let i=0;
 $('#list').innerHTML=G.map(g=>(g[0]?`<h2 class="sh">${g[0]}</h2>`:'')+g[1].map(x=>rowH(x,`data-c="${i++}"`)).join('')).join('');
}
function all(){
 songs=rel.flatMap(p=>p.tracks.length?p.tracks.map(t=>({t:t.t,art:p.art,d:t.d||p.d,url:t.url,al:p.tracks.length>1?p.name:'',n:t.n,sp:spot(p,t)})):[{t:p.name,art:p.art,d:p.d,url:p.url,al:'',n:0}])
  .sort((a,b)=>b.d.localeCompare(a.d)||a.n-b.n);
 $('#recent').innerHTML=songs.slice(0,5).map((s,i)=>rowH({t:s.t,art:s.art,m:[fmt(s.d),s.al].filter(Boolean).join(' \u2022 ')},`data-s="${i}"`)).join('');
 cat();
}
$('#links').innerHTML=Object.keys(P).map(k=>`<a class="row" href="${P[k][1]}" target="_blank" rel="noopener">${IC[k]}<span><span class="t">${P[k][0]}</span><span class="m">${esc(P[k][1].replace(/^https?:\/\//,''))}</span></span></a>`).join('');

document.addEventListener('click',e=>{
 const s=e.target.closest('[data-s]'),c=e.target.closest('[data-c]');
 if(s){const x=songs[s.dataset.s];svc(own(x.t,x.art,x.url,x.sp),0);}
 else if(c){
  const x=view[c.dataset.c];
  if(x.k==='f')svc({t:x.t,art:x.art,apple:x.f.url,q:(x.t.replace(/\s*\(feat[^)]*\)/i,'')+' '+(x.f.by||'')).trim(),own:0},0);
  else if(x.p.tracks.length>1)proj(x.p); // albums / multi-track: show track list first, then platform choice
  else svc(one(x.p),0);
 }
});
D.addEventListener('click',e=>{
 const g=s=>e.target.closest(s);
 if(e.target===D||g('[data-x]'))D.close();
 else if(g('[data-b]'))proj(cur);
 else if(g('[data-all]'))svc(own(cur.name,cur.art,cur.url),1);
 else if(g('[data-t]')){const t=cur.tracks[g('[data-t]').dataset.t];svc(own(t.t,cur.art,t.url,spot(cur,t)),1);}
});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',x===b));
 document.querySelectorAll('section').forEach(s=>s.hidden=s.id!==b.dataset.tab);
});
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{
 F=F===b.dataset.f?'':b.dataset.f;
 document.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.f===F));
 cat();
});

// Live catalog from Apple Music: all projects, tracks, covers, dates, direct Apple links.
window.__tr=r=>{
 const m={};
 (r.results||[]).forEach(x=>{
  if(x.wrapperType!=='track'||x.kind!=='song')return;
  // Non-TR1PP albums (Where Did It Go Wrong?, Drug Musik, other feat collections): only keep tracks that credit TR1PP
  if(FX.includes(x.collectionId)||BLOCK_ALBUMS.has(x.collectionId)){
   const tn=(x.trackName||'').toLowerCase();
   if(/tr1pp|tripp/.test(tn)||/\(feat[^)]*tr1pp/.test(tn)){
    const by=fixName(x.artistName||'');
    mv.push({t:x.trackName,by,d:x.releaseDate||'',art:(x.artworkUrl100||'').replace('100x100bb','600x600bb'),url:x.trackViewUrl});
   }
   return;
  }
  const nm=fixName((x.collectionName||'').replace(/ - (Single|EP)$/,''));
  const p=m[x.collectionId]||(m[x.collectionId]={id:x.collectionId,name:nm,type:/ - Single$/.test(x.collectionName||'')?'Single':/ - EP$/.test(x.collectionName||'')?'EP':'Album',d:x.releaseDate||'',art:(x.artworkUrl100||'').replace('100x100bb','600x600bb'),url:x.collectionViewUrl||AB+x.collectionId,tracks:[]});
  p.tracks.push({t:x.trackName,n:x.trackNumber||0,url:x.trackViewUrl,d:x.releaseDate||''});
 });
 const a=Object.values(m).filter(p=>!BLOCK_ALBUMS.has(p.id));
 if(a.length){a.forEach(p=>{p.name=fixName(p.name);p.tracks.sort((x,y)=>x.n-y.n);});rel=a;all();}
};
// Songs where Tr1pp is credited on other artists' releases.
window.__fe=r=>{
 const n=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,''),m=new Map();
 (r.results||[]).forEach(x=>{
  if(x.wrapperType==='track'&&x.kind==='song'&&x.artistId!==AID&&n(x.artistName)!=='tr1pp'&&n(x.trackName+x.artistName).includes('tr1pp'))
   m.set(x.trackId,{t:x.trackName,by:fixName(x.artistName||''),d:x.releaseDate||'',art:(x.artworkUrl100||'').replace('100x100bb','600x600bb'),url:x.trackViewUrl});
 });
 // Keep our curated featuring entries (with Project capital + the 3 new tracks) and merge any new live ones
 if(m.size){
  const keep=feat.slice();
  const seen=new Set(keep.map(f=>nk(f.t)));
  m.forEach(v=>{if(!seen.has(nk(v.t)))keep.push(v);});
  feat=keep;cat();
 }
};
const jp=u=>{const s=document.createElement('script');s.src=u;document.head.append(s);};
jp(`https://itunes.apple.com/lookup?id=${AID}&entity=song&limit=200&callback=__tr`);
jp('https://itunes.apple.com/search?term=TR1PP&entity=song&limit=200&callback=__fe');
all();
</script>
</body>
